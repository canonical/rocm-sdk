name: rocm
adopt-info: rocm
summary: AMD ROCm runtime (apt)
description: |
  ROCm is a software stack, composed primarily of open-source software, that
  provides the tools for programming AMD GPUs. This SDK installs the ROCm
  runtime and development tools inside the workshop during setup-base (default
  rocm-dev). On ubuntu@22.04 and ubuntu@24.04 it uses the official AMD ROCm APT
  repository, placing everything under /opt/rocm. On ubuntu@26.04 it uses the
  ROCm packages from the Ubuntu archive, installed under /usr.
license: MIT
website: https://github.com/canonical/rocm-sdk
platforms:
  ubuntu@22.04:amd64:
  ubuntu@24.04:amd64:
  ubuntu@26.04:amd64:

plugs:
  gpu:
    interface: gpu

parts:
  rocm:
    plugin: nil
    override-pull: |
      VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")
      craftctl set version="$VERSION"
    override-build: |
      VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")
      echo "$VERSION" > "$CRAFT_PART_INSTALL/version"

      # Map platform to APT series name for the setup-base hook.
      case "${CRAFT_PLATFORM}" in
        ubuntu@22.04:amd64) SERIES=jammy  ;;
        ubuntu@24.04:amd64) SERIES=noble  ;;
        ubuntu@26.04:amd64) SERIES=resolute ;;
        *)            echo "Unsupported platform: ${CRAFT_PLATFORM}" >&2; exit 1 ;;
      esac
      echo "$SERIES" > "$CRAFT_PART_INSTALL/series"
