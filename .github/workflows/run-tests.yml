name: "Run Spread Tests"
on:
  workflow_call:
    inputs:
      sdk-channel:
        description: "rocm SDK channel the workshop pulls from (e.g. latest/edge, 7.1/stable)"
        required: false
        type: string
        default: "latest/edge"
      spread-params-extra:
        description: "Additional parameters to append to SPREAD_PARAMS"
        required: false
        type: string
        default: ""
    outputs:
      spread-results-artifact-id:
        description: "Artifact ID containing spread results"
        value: ${{ jobs.run-tests.outputs.spread-results-artifact-id }}
jobs:
  run-tests:
    runs-on: ubuntu-24.04
    env:
      SPREAD_BIN: ${{ github.workspace }}/spread-plus/spread-plus
      ROCM_SDK_PROJECT_DIR: ${{ github.workspace }}/rocm-sdk
      ROCM_SDK_CHANNEL: ${{ inputs.sdk-channel }}
      SPREAD_PARAMS: "${{ vars.SPREAD_PARAMS }} ${{ inputs.spread-params-extra }}"
      GH_TOKEN: ${{ secrets.PE_PAT }}
    outputs:
      spread-results-artifact-id: ${{ steps.upload-spread-results.outputs.artifact-id }}
    steps:
      - name: Checkout Bullwinkle
        uses: actions/checkout@v6
        with:
          repository: canonical/bullwinkle-cicd
          token: ${{ secrets.PE_PAT }}
          path: .
      - name: Checkout ROCm SDK
        uses: actions/checkout@v6
        with:
          path: ${{ env.ROCM_SDK_PROJECT_DIR }}
      - uses: actions/checkout@v6
        with:
          repository: canonical/spread-plus
          path: spread-plus
      - name: Install Go
        env:
          GOCHANNEL: 1.24/stable
        run: |
          sudo snap install go --classic --channel "$GOCHANNEL"
      - name: Build spread
        run: |
          cd spread-plus
          GOARCH="amd64" go build -o spread-plus cmd/spread/main.go
      - name: Overlay rocm-sdk config onto bullwinkle tree
        shell: bash
        run: |
          # Bullwinkle sits at the workspace root and owns the task tree
          # under packages/ and tests/. rocm-sdk overrides spread.yaml
          # (workshop bootstrap + smoke-only suites) and adds tests/workshop.yaml
          # which is envsubst-ed at spread prepare time.
          cp "$ROCM_SDK_PROJECT_DIR/spread.yaml" .
          mkdir -p tests
          cp -r "$ROCM_SDK_PROJECT_DIR/tests/." tests/
      - name: Run Spread
        id: run-spread
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          echo "::group::Spread YAML"
          cat spread.yaml
          echo "::endgroup::"
          chmod +x "$SPREAD_BIN"
          (
            set -o pipefail
            echo "results=spread-results.json" >> "$GITHUB_OUTPUT"
            echo "log=spread.log" >> "$GITHUB_OUTPUT"
            # shellcheck disable=SC2086
            "$SPREAD_BIN" -json spread-results.json -artifacts=./logs $SPREAD_PARAMS | tee spread.log
          )
      - name: Upload spread results
        id: upload-spread-results
        uses: actions/upload-artifact@v6
        if: always() && !cancelled()
        with:
          name: "spread-${{ github.run_id }}-results"
          retention-days: 3
          path: |
            ${{ steps.run-spread.outputs.log }}
            ${{ steps.run-spread.outputs.results }}
      - name: Upload spread logs
        uses: actions/upload-artifact@v6
        if: always() && !cancelled()
        with:
          name: "spread-${{ github.run_id }}-logs"
          retention-days: 3
          path: logs/
      - name: Discard spread workers
        if: always()
        run: |
          shopt -s nullglob
          for r in .spread-reuse.*.yaml; do
            "$SPREAD_BIN" -discard -reuse-pid="$(echo "$r" | grep -o -E '[0-9]+')"
          done
