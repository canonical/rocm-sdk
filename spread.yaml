project: rocm-sdk
path: /root/rocm-sdk
environment:
  DEBIAN_FRONTEND: noninteractive
  TIMESTAMP: $(date -u +"%Y-%m-%d-%H:%M:%S")
  ARTIFACT_LOG: "output-${TIMESTAMP}.log"
  # Channel the workshop pulls the rocm SDK from. Overridable from the CI
  # runner via the ROCM_SDK_CHANNEL env variable; defaults to latest/edge so
  # the nightly job validates edge before it is promoted to later channels.
  ROCM_SDK_CHANNEL: '$(HOST: echo "${ROCM_SDK_CHANNEL:-latest/edge}")'
  WORKSHOP_NAME: rocm-test
  WORKSHOP_PROJECT_DIR: /root/rocm-sdk
backends:
  tchavadar:
    type: adhoc
    wait-timeout: 2h
    kill-timeout: 12h
    halt-timeout: 3h
    discard: echo "Discarding $SPREAD_SYSTEM..."
    allocate: |
      echo "Allocating $SPREAD_SYSTEM..."
      ADDRESS gfx1201:22
    systems:
      - gfx-1201:
          username: github
          ssh-rsa-key: '$(HOST: echo "$SPREAD_SSH_KEY")'
          # ssh-key-pass: '$(HOST: echo "$SPREAD_SSH_KEY_PASS")'
          environment:
            DEB_BUILD_OPTIONS: "parallel=4"
  testflinger:
    wait-timeout: 2h
    kill-timeout: 12h
    halt-timeout: 3h
    systems:
      - gfx-1100:
          queue: 202604-38596
          image: desktop-26-04-uefi
          username: ubuntu
          reserve-key: lp:pe-bot
          ssh-rsa-key: '$(HOST: echo "$SPREAD_SSH_KEY")'
prepare: |
  set -eu

  # Workshop uses LXD as its container backend.
  snap install lxd --channel=latest/stable 2>/dev/null || snap refresh lxd --channel=latest/stable || true
  lxd waitready
  lxd init --auto 2>/dev/null || true

  snap install workshop --classic

  apt-get update
  apt-get install -y gettext-base

  # Install the workshop-flavor sh-run. Bullwinkle tests call `sh-run '<script>'`
  # for every ROCm-facing block;
  # this variant forwards the script into the running workshop, so the tests
  # exercise the SDK-provisioned container instead of the testflinger host.
  # See bullwinkle-cicd/README.md "The sh-run contract".
  #
  # Host CWD (under WORKSHOP_PROJECT_DIR) is translated to /project/<subpath>
  # inside the container, so relative file references in tasks resolve to
  # the same file the host `execute:` block would see.
  cat > /usr/local/bin/sh-run <<'SHRUN_EOF'
  #!/bin/bash
  set -eu
  WORKSHOP="${WORKSHOP_NAME:-rocm-test}"
  PROJECT="${WORKSHOP_PROJECT_DIR:-$SPREAD_PATH}"
  CWD="$(pwd)"
  if [ "$CWD" = "$PROJECT" ]; then
    CONTAINER_CWD="/project"
  elif [ "${CWD#$PROJECT/}" != "$CWD" ]; then
    CONTAINER_CWD="/project/${CWD#$PROJECT/}"
  else
    CONTAINER_CWD="/project"
  fi
  if [ $# -gt 0 ]; then
    exec workshop -p "$PROJECT" exec --uid 0 -w "$CONTAINER_CWD" "$WORKSHOP" -- bash -c "$*"
  else
    exec workshop -p "$PROJECT" exec --uid 0 -w "$CONTAINER_CWD" "$WORKSHOP" -- bash -s
  fi
  SHRUN_EOF
  chmod 0755 /usr/local/bin/sh-run

  # Materialise the workshop definition, substituting the SDK channel.
  mkdir -p "$WORKSHOP_PROJECT_DIR/.workshop"
  envsubst < ./tests/workshop.yaml \
    > "$WORKSHOP_PROJECT_DIR/.workshop/${WORKSHOP_NAME}.yaml"

  echo "--- workshop definition ---"
  cat "$WORKSHOP_PROJECT_DIR/.workshop/${WORKSHOP_NAME}.yaml"
  echo "---------------------------"

  workshop -p "$WORKSHOP_PROJECT_DIR" launch "$WORKSHOP_NAME"
  # Wire the GPU plug so /dev/kfd and /dev/dri/renderD* are visible inside
  # the workshop. Failure tolerated in case the plug is auto-connected on
  # this workshop revision.
  workshop -p "$WORKSHOP_PROJECT_DIR" connect "${WORKSHOP_NAME}:gpu" || true
restore: |
  workshop -p "$WORKSHOP_PROJECT_DIR" remove "$WORKSHOP_NAME" || true
  rm -rf "$WORKSHOP_PROJECT_DIR/.workshop"
